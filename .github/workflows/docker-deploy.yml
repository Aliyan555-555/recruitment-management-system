name: ATS Docker CI/CD

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci_security_scan:
    name: Lint, Build, and Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint project
        run: npm run lint

      - name: Build project
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: npm run build

      - name: Build Docker image for scanning
        run: docker build -t ats-app:ci .

      - name: Run Trivy filesystem scan (repo)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          format: sarif
          output: trivy-fs.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Upload filesystem scan to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-fs.sarif

      - name: Run Trivy image scan (container)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ats-app:ci
          scanners: vuln,secret
          format: sarif
          output: trivy-image.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Upload image scan to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-image.sarif

  deploy:
    name: Deploy to Production Host
    runs-on: self-hosted
    environment: production
    timeout-minutes: 30
    needs: ci_security_scan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Docker engine and Compose plugin
        run: |
          docker --version
          docker compose version

      - name: Generate production environment file
        run: |
          cat << 'EOF' > .env
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          DIRECT_URL=${{ secrets.DIRECT_URL }}
          NEXTAUTH_SECRET=${{ secrets.NEXTAUTH_SECRET }}
          NEXTAUTH_URL=${{ secrets.NEXTAUTH_URL }}
          NODE_ENV=production
          PORT=${{ secrets.PORT }}
          APP_URL=${{ secrets.APP_URL }}
          MAX_FILE_SIZE=${{ secrets.MAX_FILE_SIZE }}
          ALLOWED_FILE_TYPES=${{ secrets.ALLOWED_FILE_TYPES }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          JWT_EXPIRES_IN=${{ secrets.JWT_EXPIRES_IN }}
          SESSION_MAX_AGE=${{ secrets.SESSION_MAX_AGE }}
          SMTP_HOST=${{ secrets.SMTP_HOST }}
          SMTP_PORT=${{ secrets.SMTP_PORT }}
          SMTP_SECURE=${{ secrets.SMTP_SECURE }}
          SMTP_USER=${{ secrets.SMTP_USER }}
          SMTP_PASS=${{ secrets.SMTP_PASS }}
          SMTP_FROM=${{ secrets.SMTP_FROM }}
          CLOUDINARY_CLOUD_NAME=${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY=${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET=${{ secrets.CLOUDINARY_API_SECRET }}
          EOF
          chmod 600 .env

      - name: Rebuild and deploy
        run: |
          docker compose build --pull
          docker compose up -d --remove-orphans

      - name: Validate deployed container health
        run: |
          echo "Waiting for health check status..."
          sleep 15
          CONTAINER_NAME="ats_app_production"
          STATUS="$(docker inspect -f '{{.State.Health.Status}}' "$CONTAINER_NAME")"
          echo "Container health status: $STATUS"
          if [ "$STATUS" = "unhealthy" ]; then
            echo "Deployment failed: health check is unhealthy"
            exit 1
          fi

      - name: Prune unused Docker resources
        run: |
          docker image prune -af --filter "until=24h" || true
          docker volume prune -f || true
