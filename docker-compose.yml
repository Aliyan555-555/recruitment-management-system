version: '3.8'

networks:
  ats_prod_network:
    driver: bridge

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ats_app_production
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    env_file:
      - .env
    networks:
      - ats_prod_network

    # Runtime hardening
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /app/.next/cache:rw,noexec,nosuid,size=128m
    pids_limit: 200

    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:$${PORT:-3000}/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
